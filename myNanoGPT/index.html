<!DOCTYPE html> 
<html>
    <head>
        <title>AI Text Generation Portal</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            h1 {
                text-align: center;
                margin-bottom: 20px;
                font-size: 45px;
                font-weight: bold;
            }
            
            label {
                font-size: 18px;
                width: 200px;
                text-align: right;
            }

            input, select {
                width: 200px;
                padding: 8px;
                font-size: 16px;
                text-align: left;
            }

            select {
                width: 220px;
            }

            #lbl{
                text-align: right;
            }

            #generate-btn {
                padding: 10px 25px;
                font-size: 18px;
                margin-top: 20px;
                cursor: pointer;
                border-radius: 6px;
                border: 1px solid #333;
                background-color: #f5f5f5;
            }

            #output-text {
                margin-top: 20px;
                width: 600px;
                padding: 15px;
                background: #f8f8f8;
                border: 1px solid #ccc;
                min-height: 120px;
                display: none; 
                white-space: pre-wrap;
            }
           #spinner {
                display: none;
                border: 6px solid #eee;
                border-top: 6px solid #555;
                border-radius: 50%;
                width: 40px;
                height: 40px;
                animation: spin 1s linear infinite;
                position: absolute;
                left: 50%;
                top: 35%;
                transform: translate(-50%, -50%);
            }

            @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }
        </style>
    </head>
    <body>
        <h1>AI Text Generation Portal</h1>
        <table>
            <tr>
                <td id = "lbl">
                    <label>Number of Samples:</label><br>
                </td>
                <td>
                    <input id="numSamples" type="number" min="1" value="1">
                </td>
            </tr>
            <tr>
                <td id = "lbl">
                    <label>Select Dataset:</label><br>
                </td>
                <td>
                    <select id="outDir">
                        <option value="out-twitter">Twitter</option>
                        <option value="out-movies">Movies</option>
                    </select>
                </td>
            </tr>
        </table>
        
        <div style="text-align:center;">
            <button id="generate-btn">Generate</button>            
        </div>

        <div id="spinner"></div>

        <div id="output-text"></div>

        <script>
            document.getElementById("generate-btn").onclick = async function () {
                    const numSamples = document.getElementById("numSamples").value;
                    const dataset = document.getElementById("outDir").value;
                    const output_text = document.getElementById("output-text")
                    const spinner = document.getElementById("spinner")

                    spinner.style.display = "block";
                    output_text.style.display = "none"; 

                    const response = await fetch(`/generate?num_samples=${numSamples}&out_dir=${dataset}`);
                    const output_data = await response.json();
                    spinner.style.display = "none"
                    output_text.style.display = "block"
                    output_text.innerText = output_data.output
            };
        </script>
    </body>
</html>
